name: Build NoorOS ISO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso isolinux syslinux-common syslinux-efi grub-pc-bin grub-efi-amd64-bin mtools dosfstools rsync curl

      - name: Build NoorOS ISO
        run: |
          chmod +x distro/build-iso.sh
          sudo ./distro/build-iso.sh

      - name: Upload NoorOS ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoorOS-x86_64-ISO
          path: output/*.iso
          retention-days: 7
